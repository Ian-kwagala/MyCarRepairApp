# Continuous integration: on every pull request and every push to main, install dependencies,
# then run lint, the TypeScript type-check and the Jest unit tests. Any failure fails the check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx expo lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx jest --ci
