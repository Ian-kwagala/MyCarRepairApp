# Local backend for development: PostgreSQL + the API on http://localhost:4000/api/v1
#   docker compose up --build
# Then start the app against it (phone on the same Wi-Fi: use your computer's LAN IP instead of localhost):
#   EXPO_PUBLIC_API_URL=http://192.168.1.20:4000/api/v1 npx expo start
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mycarrepair
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/mycarrepair
      JWT_SECRET: dev-only-secret-change-me
      ADMIN_PASSWORD: admin
      NODE_ENV: development
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
