# Render Blueprint: the MyCarRepair API + PostgreSQL. On render.com: New → Blueprint → pick this repository.
# Free plans are fine for a pilot (the API sleeps after 15 min idle; free databases expire after 30 days);
# use "starter" plans for real users.
services:
  - type: web
    name: mycarrepair-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd server && npm ci
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mycarrepair-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false # Render asks for it when you create the Blueprint
databases:
  - name: mycarrepair-db
    plan: free
    region: frankfurt
    databaseName: mycarrepair
